name: Build MonoOS Launcher APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: "monoos-launcher-source (1)"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build web launcher bundle
        run: |
          npm install --legacy-peer-deps
          npm run build
          mkdir -p android/app/src/main/assets/www
          cp -r dist/* android/app/src/main/assets/www/
          rm -f android/app/src/main/assets/www/monoos-launcher-source.zip

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Prepare Android SDK
        run: |
          SDK_DIR="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK_DIR" >> "$GITHUB_ENV"
          find "$SDK_DIR" -name sdkmanager -type f | head -n 1 | xargs -r -I{} bash -c 'yes | "{}" --licenses > /dev/null 2>&1 || true'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Assemble Debug APK
        working-directory: "monoos-launcher-source (1)/android"
        run: gradle assembleDebug --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MonoOS-Launcher-debug-apk
          path: "monoos-launcher-source (1)/android/app/build/outputs/apk/debug/app-debug.apk"
